name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          bunx playwright install-deps chromium
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - run: bun run test:unit
      - name: E2E and packaged executable smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" sh -c 'bun run test:e2e && bun run test:smoke'
      - name: E2E
        if: runner.os != 'Linux'
        run: bun run test:e2e
      - name: Packaged executable smoke test
        if: runner.os != 'Linux'
        run: bun run test:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7
